{{- $turbo_js := resources.Get "js/turbo.js" }}
{{- if not site.Params.assets.disableFingerprinting }}
{{ $turbo_js = $turbo_js | resources.Fingerprint "sha512" }}
<script defer crossorigin="anonymous" src="{{ $turbo_js.RelPermalink }}" integrity="{{ $turbo_js.Data.Integrity }}"></script>
{{- else }}
<script defer crossorigin="anonymous" src="{{ $turbo_js.RelPermalink }}"></script>
{{- end }}
