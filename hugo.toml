baseURL = 'localhost:1313'
languageCode = 'en-us'
title = "Ashwin's Website"
description = "Ashwin Naren's personal website."
enableRobotsTXT = true

[menus]
[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 1

[[menus.main]]
name = 'Projects'
pageRef = '/projects'
weight = 2

[[menus.main]]
name = 'Blog'
pageRef = '/blog'
weight = 3

# [[menus.main]]
# name = 'Music'
# pageRef = '/music'
# weight = 3

[[menus.main]]
name = 'Publications'
pageRef = '/publications'
weight = 4

[[menus.main]]
name = 'Search'
pageRef = '/search'
weight = 99

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
defaultTheme = "auto"
author = "Ashwin Naren"
description = "Ashwin Naren's personal website covering machine learning reliability, theoretical computer science, projects, writing, and publications."
ShowCodeCopyButtons = true
keywords = ["Ashwin Naren", "machine learning", "theoretical computer science", "research", "publications"]

[params.assets]
theme_color = "#2563eb"
msapplication_TileColor = "#2563eb"
favicon = "favicon.ico"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"

[[params.socialIcons]]
name = "github"
url = "https://github.com/arihant2math/"

[[params.socialIcons]]
name = "google scholar"
url = "https://scholar.google.com/citations?user=gX5KMhQAAAAJ&hl=en"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
